<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9b2222; } a:hover { color: #6e1717; }
  </style>
</helmet>
<div style="width: 640px; height: 420px; box-sizing: border-box; padding: 28px 32px; background: #f3ecdd; color: #211c17; font-family: 'Frank Ruhl Libre', Georgia, 'Times New Roman', serif; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: baseline;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">Option B — Interlinear</div>
    <div style="font-size: 13px; color: #8a7f70; font-style: italic;">manuscript · rubric red on parchment</div>
  </div>
  <div style="display: flex; flex-direction: row; gap: 36px; align-items: center; flex-grow: 1;">
    <div style="width: 220px; height: 200px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg viewBox="0 0 100 100" width="176" height="176" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="100" height="100" rx="18" fill="{{accent}}"></rect>
        <rect x="42" y="24" width="38" height="7" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="36" width="50" height="3" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="34" y="48" width="46" height="7" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="60" width="40" height="3" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="50" y="72" width="30" height="7" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="84" width="52" height="3" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 50px; font-weight: 700; letter-spacing: -0.01em; line-height: 1;">Targum<span style="color: {{accent}};">.ai</span></div>
      <div style="font-size: 18px; color: {{accent}}; direction: rtl; text-align: left; line-height: 1;">תרגום</div>
      <div style="font-size: 16px; color: #4a4238; font-style: italic; margin-top: 6px;">Hebrew to English, for course material.</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: row; gap: 28px; align-items: center; padding-top: 18px; border-top: 1px solid #ddd3bf;">
    <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
      <svg viewBox="0 0 100 100" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="100" height="100" rx="22" fill="{{accent}}"></rect>
        <rect x="42" y="24" width="38" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="37" width="50" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="34" y="48" width="46" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="61" width="40" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="50" y="72" width="30" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="85" width="52" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
      </svg>
      <div style="font-size: 12px; color: #8a7f70;">favicon 32</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
      <svg viewBox="0 0 100 100" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <rect x="42" y="20" width="44" height="10" rx="1" fill="#211c17"></rect>
        <rect x="14" y="36" width="56" height="6" rx="1" fill="#211c17" opacity="0.55"></rect>
        <rect x="30" y="52" width="56" height="10" rx="1" fill="#211c17"></rect>
        <rect x="14" y="68" width="46" height="6" rx="1" fill="#211c17" opacity="0.55"></rect>
      </svg>
      <div style="font-size: 12px; color: #8a7f70;">menubar, mono</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
      <svg viewBox="0 0 100 100" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="100" height="100" rx="22" fill="{{accent}}"></rect>
        <rect x="42" y="24" width="38" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="37" width="50" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="34" y="48" width="46" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="61" width="40" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
        <rect x="50" y="72" width="30" height="8" rx="1" fill="#f3ecdd"></rect>
        <rect x="20" y="85" width="52" height="4" rx="1" fill="#f3ecdd" opacity="0.6"></rect>
      </svg>
      <div style="font-size: 19px; font-weight: 700;">Targum<span style="color: {{accent}};">.ai</span></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#9b2222","section":"Color"}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#9b2222' }; }
}
</script>
</body>
</html>
