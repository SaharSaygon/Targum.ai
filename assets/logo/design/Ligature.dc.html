<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; }
    a { color: #c2562b; } a:hover { color: #9a401c; }
  </style>
</helmet>
<div style="width: 640px; height: 420px; box-sizing: border-box; padding: 28px 32px; background: #f5f1e8; color: #1a1816; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 24px;">

    <div style="font-size: 12px; color: #8a827a;">Tת monogram · ink on paper</div>
  </div>
  <div style="display: flex; flex-direction: row; gap: 36px; align-items: center; flex-grow: 1;">
    <div style="width: 220px; height: 200px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg viewBox="0 0 120 100" width="216" height="180" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="16" width="104" height="14" fill="#1a1816"></rect>
        <rect x="20" y="16" width="14" height="68" fill="#1a1816"></rect>

      </svg>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;">Targum<span style="color: {{accent}};">.ai</span></div>
      <div style="font-size: 15px; color: #3d3832;">Hebrew to English, for course material.</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: row; gap: 28px; align-items: center; padding-top: 18px; border-top: 1px solid #e2dccf;">
    <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
      <div style="width: 32px; height: 32px; border-radius: 7px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 120 100" width="22" height="18" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="16" width="104" height="14" fill="#f5f1e8"></rect>
          <rect x="20" y="16" width="14" height="68" fill="#f5f1e8"></rect>
          <rect x="62" y="16" width="14" height="68" fill="#f5f1e8"></rect>
          <rect x="48" y="70" width="28" height="14" fill="#f5f1e8"></rect>
          <rect x="98" y="16" width="14" height="68" fill="#f5f1e8"></rect>
        </svg>
      </div>
      <div style="font-size: 11px; color: #8a827a;">favicon 32</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
      <svg viewBox="0 0 120 100" width="22" height="18" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="16" width="104" height="14" fill="#1a1816"></rect>
        <rect x="20" y="16" width="14" height="68" fill="#1a1816"></rect>
        <rect x="62" y="16" width="14" height="68" fill="#1a1816"></rect>
        <rect x="48" y="70" width="28" height="14" fill="#1a1816"></rect>
        <rect x="98" y="16" width="14" height="68" fill="#1a1816"></rect>

      <div style="font-size: 11px; color: #8a827a;">menubar, mono</div>

    <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
      <svg viewBox="0 0 120 100" width="26" height="22" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="16" width="104" height="14" fill="#1a1816"></rect>
        <rect x="20" y="16" width="14" height="68" fill="#1a1816"></rect>
        <rect x="62" y="16" width="14" height="68" fill="{{accent}}"></rect>
        <rect x="48" y="70" width="28" height="14" fill="{{accent}}"></rect>
        <rect x="98" y="16" width="14" height="68" fill="{{accent}}"></rect>
      </svg>
      <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">Targum<span style="color: {{accent}};">.ai</span></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c2562b","section":"Color"}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#c2562b' }; }
}
</script>
</body>
</html>
